name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the bundle to a release
    steps:
      # The GNOME SDK and the build need more room than the runner has by default.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
          large-packages: false

      - uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Ubuntu blocks the user namespaces that Flatpak's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      # Flatpak builds have no network, so every crate has to be listed as a source.
      - name: List the Rust dependencies
        run: |
          python3 -m venv /tmp/generator
          /tmp/generator/bin/pip install --quiet aiohttp tomlkit
          curl -fsSL -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          /tmp/generator/bin/python /tmp/flatpak-cargo-generator.py Cargo.lock -o build-aux/cargo-sources.json

      - name: Build the Flatpak
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub --repo=_repo _flatpak \
            build-aux/de.example.Stempeluhr.yaml
          flatpak build-bundle _repo stempeluhr.flatpak de.example.Stempeluhr

      - uses: actions/upload-artifact@v4
        with:
          name: stempeluhr.flatpak
          path: stempeluhr.flatpak

      - name: Attach the bundle to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: stempeluhr.flatpak
          generate_release_notes: true
