[workspace]
members = ["core"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[package]
name = "stempeluhr"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
stempeluhr-core = { path = "core" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
ashpd = { version = "0.14", default-features = false, features = ["tokio", "global_shortcuts"] }
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
jiff = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"

[profile.release]
# Thin and parallel: keeps local Flatpak builds quick.
lto = false
codegen-units = 16
